name: Draft a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number (e.g. 1.2.3) OR one of: patch|minor|major|prepatch|preminor|premajor|prerelease'
        required: true
        default: 'patch'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-poetry-env

      - name: Update version
        id: updated_version
        shell: bash
        run: |
          poetry version ${{ github.event.inputs.version }}
          version=$(poetry version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update citation metadata
        shell: bash
        run: |
          version=${{ steps.updated_version.outputs.version }}
          sed -i "s|^version: .*|version: $version|" CITATION.cff
          sed -i "s|^date-released: .*|date-released: \"$(date -u +%Y-%m-%d)\"|" CITATION.cff

      - name: Update changelog
        shell: bash
        run: |
          version=${{ steps.updated_version.outputs.version }}
          poetry run kacl-cli release "$version" --modify --auto-link
          echo "" >> CHANGELOG.md
          poetry run kacl-cli get "$version" > release_notes.md

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'CHANGELOG.md pyproject.toml CITATION.cff'
          message: 'Release ${{ steps.updated_version.outputs.version }}'

      - name: Create tag
        shell: bash
        run: |
          version=${{ steps.updated_version.outputs.version }}
          git tag "$version"
          git push origin "$version"

      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ steps.updated_version.outputs.version }}
          gh release create "$version" \
            --draft \
            --title "Release $version" \
            --notes-file release_notes.md
